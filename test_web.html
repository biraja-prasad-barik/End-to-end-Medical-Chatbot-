<!DOCTYPE html>
<html>
<head>
    <title>Test Medical Chatbot</title>
</head>
<body>
    <h1>Test Medical Chatbot</h1>
    <div id="response"></div>
    <input type="text" id="messageInput" value="what is acne?" placeholder="Enter your question">
    <button onclick="testMessage()">Test</button>

    <script>
        function testMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            
            console.log('Sending message:', message);
            
            fetch('http://localhost:8080/get', {
                method: 'POST',
                headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                body: 'msg=' + encodeURIComponent(message)
            })
            .then(response => {
                console.log('Response status:', response.status);
                return response.text();
            })
            .then(data => {
                console.log('Response data:', data);
                document.getElementById('response').innerHTML = '<p><strong>Response:</strong> ' + data + '</p>';
            })
            .catch(error => {
                console.error('Error:', error);
                document.getElementById('response').innerHTML = '<p><strong>Error:</strong> ' + error + '</p>';
            });
        }
    </script>
</body>
</html>
